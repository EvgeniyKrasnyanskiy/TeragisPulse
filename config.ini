[postgresql]
# Эти данные теперь в .env
host = ${DB_HOST}
database = ${DB_NAME}
user = ${DB_USER}
password = ${DB_PASS}
port = ${DB_PORT}

[window]
width = 820
height = 600
title = TeragisPulse

[table_main]
col_width = 115
row_height = 30
header_font_size = 13
cell_font_size = 18

[table_clients]
col_width = 200
row_height = 30
header_font_size = 12
cell_font_size = 12
max_chars_fio = 25
max_chars_comment = 45

[status_colors]
Completed = #ff8e8a
On_Treatment = #66ff66

[colors]
# Основные группы
Planned_1 = #E0FFFF
Completed_1 = #AFEEEE
Total_1 = #7FFFD4
Planned_2 = #ccff99
Completed_2 = #b3ff66
Total_2 = #99ff33
Planned_Other = #FFFACD
Completed_Other = #EEE8AA
Total_Other = #FFD700
Planned_All = #E6E6FA
Completed_All = #D8BFD8
Total_All = #DDA0DD
Default = #ffffff

# Даты и служебные
date_default = #555555
date_today = #FFFF00
date_future = #4A90E2
date_duplicate = #FF0000
duplicate_patient = #FF6B6B
today_border = #990000
new_patient = #A5D6A7
new_patient_repeat = #4CAF50
last_fraction = #FFCC80
last_fraction_repeat = #FF9800
weekend_zero = #777777
weekend_zero_text = #3A3A3A

[logic]
# История и будущее в днях
history_days = 10
future_days = 10
# Количество строк в таблице
total_display_rows = 21
# Порог уведомления о завершении (пациентов осталось)
low_patients_threshold = 1
# Среднее время на одного пациента в минутах (для расчета конца смены)
avg_time_per_patient = 7

[bot_intervals]
# Интервал обновления дневной (секунды)
day_update_sec = 600
# Интервал обновления ночной (секунды)
night_update_sec = 1800

[db_status]
# Статусы из tcalendar_status (используются в расписании)
calendar_planned = 1
calendar_on_treatment = 3
calendar_completed = 4

# Статусы из tseries_status (с картинки пользователя)
series_on_treatment = 1
series_not_started = 2
series_on_break = 3
series_suspended = 4
series_stopped = 5
series_completed = 6

[telegram]
use_ws = True
interval_minutes = 0
interval_seconds = 5
max_hours = 0
no_change_minutes = 30